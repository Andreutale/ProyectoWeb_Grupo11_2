<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultas | Módulo</title>
  <link rel="stylesheet" href="../css/libro_de_estilos.css" />
  <link rel="stylesheet" href="../css/Modulo_header.css" />
  <link rel="stylesheet" href="../css/Modulo_footer.css" />
  <link rel="stylesheet" href="../css/Modulo_consulta.css" />
</head>
<body>

  <!-- Header -->
  <div class="header-container" id="header"></div>

  <!-- Contenido principal -->
  <main class="main-container">
    <h1 class="consulta-titulo">Consultas</h1>
    <div class="consulta-container">
      <form class="consulta-form">
        <div class="form-left">
          <div class="input-group">
            <label for="correo">Correo *</label>
            <input type="email" id="correo" name="correo" required />
          </div>
          <div class="input-group">
            <label for="tipo">Tipo *</label>
            <select id="tipo" name="tipo" required>
              <option value="inicio">Error en el inicio de sesión</option>
              <option value="acceso">Problema con acceso a materiales</option>
              <option value="email">No recibo correos institucionales</option>
              <option value="otro">Otro problema técnico</option>
            </select>
          </div>
          <div class="input-group">
            <label for="archivo">Adjuntos</label>
            <input type="file" id="archivo" name="archivo" />
          </div>
        </div>
        <div class="form-right">
          <div class="input-group">
            <label for="descripcion">Descripción *</label>
            <textarea id="descripcion" name="descripcion" required></textarea>
          </div>
        </div>
        <div class="form-submit">
          <button type="submit">Enviar consulta</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Placeholder para footer -->
  <div id="footer"></div>

  <!-- Popup de éxito -->
  <div id="popup-exito" class="popup">
    <div class="popup-contenido">
      <p>Su consulta ha sido enviada con éxito</p>
    </div>
  </div>

  <script type="module">
    import { iniciarMenuHamburguesa } from '../js/Modulo_header.js';
    // Header
    fetch("Modulo_header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;
        iniciarMenuHamburguesa();
      });
    // Footer
    fetch("Modulo_footer.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("footer").innerHTML = html;
      });

    // Lógica del formulario y popup
    const formulario = document.querySelector('.consulta-form');
    const popup = document.getElementById('popup-exito');
    formulario.addEventListener('submit', event => {
      event.preventDefault();
      formulario.reset();
      popup.style.display = 'flex';
      setTimeout(() => popup.style.display = 'none', 3000);
    });
  </script>

</body>
</html>
