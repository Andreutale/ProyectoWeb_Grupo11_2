<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registro | WEB </title>
    <link rel="stylesheet" href="../css/libro_de_estilos.css">
    <link rel="stylesheet" href="../css/Web_header_no_registrado.css">
    <link rel="stylesheet" href="../css/Web_footer.css">
    <link rel="stylesheet" href="../css/Web_registro.css">
</head>
<body>
<img class="fondo_landing" src="../../../images/fondo_landing_web.png" alt="Imagen del fondo de la pantalla">
<img class="img_persona" src="../../../images/persona_registro_web.png" alt="Imagen de la persona que aparece en el high fidelity
        de registro">

<div id="header"></div>
<main>
    <form class="contenedor_registro" action="../php/Web_registro.php" method="POST">
        <h1>Registro</h1>
        <ul class="contenedor_div_formulario">
            <li class="contenedor_1_formulario">
                <label for="nombre">Nombre *</label>
                <input id="nombre" name="nombre" type="text" placeholder="Carlos" required>

                <label for="correo">Correo *</label>
                <input id="correo" name="correo" type="email" placeholder="carlosgarcia@gmail.com" required>

                <label for="contraseña">Contraseña *</label>
                <input id="contraseña" name="contraseña" type="password" placeholder="*********" required>
            </li>
            <li class="contenedor_2_formulario">
                <label for="apellidos">Apellidos *</label>
                <input id="apellidos" name="apellidos" type="text" placeholder="García" required>

                <label for="telefono">Teléfono *</label>
                <input id="telefono" name="telefono" type="text" placeholder="987 654 321" required>

                <label for="confirmarContraseña">Confirmar contraseña *</label>
                <input id="confirmarContraseña" name="confirmarContraseña" type="password" placeholder="*********" required>
            </li>
        </ul>
        <p id="mensaje-error" class="mensaje-error">Correo ya registrado</p>
        <button class="btn-azul-verdoso" type="submit">Regístrate</button>
        <a href="Web_inicio_sesion.html"><p>¿Ya tienes cuenta? <span class="parrafo_verde">Inicia Sesión</span></p></a>
    </form>
</main>


<div id="footer"></div>

<script type="module">
    // Primero importamos las funciones y datos necesarios
    import { iniciarMenuHamburguesa } from "../js/Modulo_header.js";
    // Cargamos el HTML del header y footer
    fetch("Web_header_no_registrado.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("header").innerHTML = html;
            iniciarMenuHamburguesa();
        });

    fetch("Web_footer.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("footer").innerHTML = html;
        });
</script>

</body>
</html>
