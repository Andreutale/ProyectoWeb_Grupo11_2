<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta</title>
  <link rel="stylesheet" href="../css/Web_consultas.css" />
  <link rel="stylesheet" href="../css/Web_header_registrado.css">
  <link rel="stylesheet" href="../css/Web_footer.css">
  <link rel="stylesheet" href="../css/libro_de_estilos.css">


</head>
<body>
<!-- header -->
<div id="header"></div>

    <!-- Titulo de pagina -->
<img class="fondo_consulta" src="../../../images/FondoConsulta.png" alt="Fondo de la sección de consulta">
  <section class="consulta-section">
    <h2 class="consulta-titulo">Consulta</h2>
    <!-- Conteiner de consultas -->
    <div class="consulta-container">
      <form class="consulta-form">
        <div class="form-left">
          <div class="input-group">
            <!-- nombre -->
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>
          <!-- apellidos -->
          <div class="input-group">
            <label for="apellidos">Apellidos *</label>
            <input type="text" id="apellidos" name="apellidos" required />
          </div>
          <!-- correo -->
          <div class="input-group">
            <label for="correo">Correo *</label>
            <input type="email" id="correo" name="correo" required />
          </div>
          <!-- Tipo de consulta -->
          <div class="input-group">
            <label for="tipo">Tipo de consulta *</label>
            <input type="text" id="tipo" name="tipo" required />
          </div>
          <!-- asunto -->
          <div class="input-group">
            <label for="asunto">Asunto *</label>
            <input type="text" id="asunto" name="asunto" required />
          </div>
        </div>
        <!-- rellenar texto consulta -->
        <div class="form-right">
          <div class="input-group">
            <label for="descripcion">Descripción *</label>
            <textarea id="descripcion" name="descripcion" required></textarea>
          </div>
          <!-- boton enviar -->
          <button type="submit">Enviar correo</button>
        </div>
      </form>
    </div>
  </section>
    <!-- footer -->
<div id="footer"></div>

<script type="module">
  // Importamos el menu hamburguesa
  import { iniciarMenuHamburguesa } from '../js/Modulo_header.js';


  // Cargamos el HTML del header y footer
  fetch("../php/cargar_header.php")
          .then(res => res.text())
          .then(html => {
            document.getElementById("header").innerHTML = html;
            iniciarMenuHamburguesa(); // Si tienes esta función para el menú
          });

  fetch("Web_footer.html")
          .then(res => res.text())
          .then(html => {
            document.getElementById("footer").innerHTML = html;
          });
</script>

  <script type="module">
    import { iniciarMenuHamburguesa } from '../js/Modulo_header.js'
    iniciarMenuHamburguesa();
  </script>



</body>
</html>
